<!doctype html>
<html lang="en">
<body style="margin:0;padding:0;background:#f6f1e7;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f1e7;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#fffdf8;border:2px solid #16130f;border-radius:20px;">
        <tr><td style="padding:28px 24px 8px;font-family:Helvetica,Arial,sans-serif;color:#16130f;">
          <div style="font-size:24px;font-weight:800;letter-spacing:-0.5px;">&#8645; Changel</div>
        </td></tr>
        <tr><td style="padding:8px 24px 0;font-family:Helvetica,Arial,sans-serif;color:#3b352d;font-size:16px;line-height:1.5;">
          <p style="margin:0 0 6px;font-size:20px;font-weight:800;color:#16130f;">Your sign-in code</p>
          <p style="margin:0 0 18px;">Enter this code in Changel to sign in. You'll stay signed in on that browser.</p>
        </td></tr>
        <tr><td align="center" style="padding:0 24px;">
          <div style="font-family:'Courier New',Courier,monospace;font-size:34px;font-weight:700;letter-spacing:8px;color:#16130f;background:#f6f1e7;border:2px dashed #16130f;border-radius:14px;padding:14px 10px;">{{ .Token }}</div>
        </td></tr>
        <tr><td align="center" style="padding:18px 24px 6px;font-family:Helvetica,Arial,sans-serif;font-size:14px;color:#7a7166;">or</td></tr>
        <tr><td align="center" style="padding:0 24px 24px;">
          <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;background:#16130f;color:#f6f1e7;font-family:Helvetica,Arial,sans-serif;font-weight:800;font-size:16px;text-decoration:none;border-radius:14px;padding:14px 22px;">Sign in on this device</a>
        </td></tr>
        <tr><td style="padding:0 24px 26px;font-family:Helvetica,Arial,sans-serif;font-size:13px;line-height:1.5;color:#7a7166;">
          Your games and streak come with you to every device you sign in on. The code works for 1 hour. If you didn't ask for this, you can ignore this email.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
